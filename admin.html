<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090611"><title>MolokSa3aSmp — Admin</title>
<style>
:root{--bg:#08060f;--panel:#120e1d;--line:#342447;--purple:#a855f7;--text:#f7f3ff;--muted:#b8adc9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#452078,transparent 45%),var(--bg);color:var(--text);font:15px/1.6 system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:1100px;margin:35px auto;padding:18px}.brand{font-size:27px;font-weight:900;letter-spacing:-1px}.brand span{color:#d8b4fe}.muted{color:var(--muted)}.panel{background:linear-gradient(145deg,#171126,#0e0b17);border:1px solid #ffffff16;border-radius:18px;padding:22px;margin:18px 0}input,button,select{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #423052}input,select{background:#090711;color:white;width:min(100%,380px);margin:4px 0}button{background:linear-gradient(120deg,#9333ea,#6d28d9);color:white;font-weight:800;cursor:pointer;margin:4px}button.secondary{background:#251a35}button.reject{background:#7f1d1d}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{margin:10px 0;color:#ddd6fe}.app{border:1px solid var(--line);background:#0d0a15;padding:18px;border-radius:13px;margin:12px 0;overflow-wrap:anywhere}.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:#382353;color:#e9d5ff;font-size:12px}.hidden{display:none}a{color:#c4b5fd}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.filter{width:auto;max-width:100%}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">MOLOK<span>SA3ASMP</span> / ADMIN</div><p class="muted">Private application review dashboard</p></div><a href="./index.html">← Public website</a></div>
<section class="panel" id="authPanel"><h2>Administrator sign in</h2><p class="muted">Sign in with an admin account that has been added to the database.</p><div><input id="email" type="email" placeholder="Admin email" autocomplete="username"></div><div><input id="password" type="password" placeholder="Password" autocomplete="current-password"></div><div class="row"><button id="login">Sign in</button><button class="secondary" id="logout" hidden>Sign out</button></div><div id="authStatus" class="status" role="status"></div></section>
<section class="panel hidden" id="applicationsPanel"><div class="top"><h2>Applications</h2><div class="row"><select id="filter" class="filter"><option value="all">All ranks</option><option>Media</option><option>Streamer</option><option>YouTuber</option><option>Admin</option><option>Helper</option></select><button id="refresh" class="secondary">Refresh</button></div></div><div id="apps" class="muted">Loading...</div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="PASTE_YOUR_SUPABASE_PROJECT_URL_HERE",SUPABASE_ANON_KEY="PASTE_YOUR_SUPABASE_ANON_KEY_HERE";
const authStatus=document.getElementById('authStatus'),appsBox=document.getElementById('apps');let client=null,allApps=[];
function msg(t){authStatus.textContent=t}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderApps(){const filter=document.getElementById('filter').value;const data=allApps.filter(a=>filter==='all'||a.rank===filter);if(!data.length){appsBox.textContent='No applications found for this filter.';return}
appsBox.innerHTML=data.map(a=>`<article class="app"><div class="row"><h3>${esc(a.minecraft_username)}</h3><span class="pill">${esc(a.rank||'Media')}</span><span class="pill">${esc(a.status)}</span></div>
<p><b>Discord:</b> ${esc(a.discord_username)}</p>${a.platform?`<p><b>Platform:</b> ${esc(a.platform)} · <b>Followers:</b> ${esc(a.followers)}</p>`:''}
${a.channel_url?`<p><b>Channel:</b> <a href="${esc(a.channel_url)}" target="_blank" rel="noopener noreferrer">${esc(a.channel_url)}</a></p>`:''}
${a.age?`<p><b>Age:</b> ${esc(a.age)}</p>`:''}${a.experience?`<p><b>Experience:</b> ${esc(a.experience)}</p>`:''}
<p><b>Reason:</b> ${esc(a.reason)}</p><p class="muted">Submitted: ${esc(new Date(a.created_at).toLocaleString())}</p>
<div class="row"><button onclick="setStatus('${a.id}','accepted')">Accept</button><button class="reject" onclick="setStatus('${a.id}','rejected')">Reject</button><button class="secondary" onclick="setStatus('${a.id}','pending')">Mark pending</button></div></article>`).join('')}
async function loadApps(){appsBox.textContent='Loading...';const {data,error}=await client.from('media_applications').select('*').order('created_at',{ascending:false});if(error){appsBox.textContent='Could not load applications. Verify that this account is listed in media_admins.';return}allApps=data||[];renderApps()}
window.setStatus=async(id,status)=>{const {error}=await client.from('media_applications').update({status}).eq('id',id);if(error){alert('Could not update status.');return}await loadApps()};
document.getElementById('login').onclick=async()=>{if(SUPABASE_URL.includes('PASTE_')||SUPABASE_ANON_KEY.includes('PASTE_')){msg('Site owner: add the Supabase URL and public anon/publishable key in admin.html first.');return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg('Sign-in failed. Check the email/password and confirm this account has admin access.');return}msg('Signed in.');document.getElementById('logout').hidden=false;document.getElementById('applicationsPanel').classList.remove('hidden');await loadApps()};
document.getElementById('logout').onclick=async()=>{if(client)await client.auth.signOut();document.getElementById('applicationsPanel').classList.add('hidden');document.getElementById('logout').hidden=true;msg('Signed out.')};
document.getElementById('refresh').onclick=loadApps;document.getElementById('filter').onchange=renderApps;
</script></body></html>
